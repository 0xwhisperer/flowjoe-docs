<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc"><title id="title">Share exactly the terminal lines you choose</title><desc id="desc">Select the excerpt: Highlight output in the terminal tab you are viewing.; Review the card: Ask Joe about it and inspect the exact text offered for sharing.; Share or cancel: Only Share with Joe sends the excerpt. Cancel sends nothing.. Sharing output does not let Joe type terminal commands. Other tabs and later output are not included.</desc><rect width="1100" height="420" rx="18" fill="#171819"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="42" fill="#ffad42" font-size="15" letter-spacing="2">CONCEPT DIAGRAM</text><text x="36" y="88" fill="#faf4e9" font-size="30" font-weight="700">Share exactly the terminal lines you choose</text><rect x="36.0" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="56.0" y="159" fill="#ffad42" font-size="22" font-weight="700">Select the excerpt</text><text x="56.0" y="219" fill="#faf4e9" font-size="20">Highlight output in the</text><text x="56.0" y="246" fill="#faf4e9" font-size="20">terminal tab you are</text><text x="56.0" y="273" fill="#faf4e9" font-size="20">viewing.</text><path d="M365.6666666666667 227h18m-6-6 6 6-6 6" stroke="#ffad42" stroke-width="2" fill="none"/><rect x="386.6666666666667" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="406.6666666666667" y="159" fill="#ffad42" font-size="22" font-weight="700">Review the card</text><text x="406.6666666666667" y="219" fill="#faf4e9" font-size="20">Ask Joe about it and</text><text x="406.6666666666667" y="246" fill="#faf4e9" font-size="20">inspect the exact text</text><text x="406.6666666666667" y="273" fill="#faf4e9" font-size="20">offered for sharing.</text><path d="M716.3333333333334 227h18m-6-6 6 6-6 6" stroke="#ffad42" stroke-width="2" fill="none"/><rect x="737.3333333333334" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="757.3333333333334" y="159" fill="#ffad42" font-size="22" font-weight="700">Share or cancel</text><text x="757.3333333333334" y="219" fill="#faf4e9" font-size="20">Only Share with Joe sends</text><text x="757.3333333333334" y="246" fill="#faf4e9" font-size="20">the excerpt. Cancel sends</text><text x="757.3333333333334" y="273" fill="#faf4e9" font-size="20">nothing.</text><text x="36" y="375" fill="#c3c4c1" font-size="17">Sharing output does not let Joe type terminal commands. Other tabs and later output are not included.</text></g></svg>