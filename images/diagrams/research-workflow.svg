<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc"><title id="title">Turn references into a useful research board</title><desc id="desc">Collect: Keep sources and observation plans with the question they support.; Annotate: Separate what a source says from your own questions and uncertainty.; Synthesize: Tag references for review and use a node summary to explain what the branch means.. Urban Canopy is a synthetic example. Its observation plans illustrate organization; they report no research findings.</desc><rect width="1100" height="420" rx="18" fill="#171819"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="42" fill="#ffad42" font-size="15" letter-spacing="2">CONCEPT DIAGRAM</text><text x="36" y="88" fill="#faf4e9" font-size="30" font-weight="700">Turn references into a useful research board</text><rect x="36.0" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="56.0" y="159" fill="#ffad42" font-size="22" font-weight="700">Collect</text><text x="56.0" y="219" fill="#faf4e9" font-size="20">Keep sources and</text><text x="56.0" y="246" fill="#faf4e9" font-size="20">observation plans with the</text><text x="56.0" y="273" fill="#faf4e9" font-size="20">question they support.</text><path d="M365.6666666666667 227h18m-6-6 6 6-6 6" stroke="#ffad42" stroke-width="2" fill="none"/><rect x="386.6666666666667" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="406.6666666666667" y="159" fill="#ffad42" font-size="22" font-weight="700">Annotate</text><text x="406.6666666666667" y="219" fill="#faf4e9" font-size="20">Separate what a source says</text><text x="406.6666666666667" y="246" fill="#faf4e9" font-size="20">from your own questions and</text><text x="406.6666666666667" y="273" fill="#faf4e9" font-size="20">uncertainty.</text><path d="M716.3333333333334 227h18m-6-6 6 6-6 6" stroke="#ffad42" stroke-width="2" fill="none"/><rect x="737.3333333333334" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="757.3333333333334" y="159" fill="#ffad42" font-size="22" font-weight="700">Synthesize</text><text x="757.3333333333334" y="219" fill="#faf4e9" font-size="20">Tag references for review</text><text x="757.3333333333334" y="246" fill="#faf4e9" font-size="20">and use a node summary to</text><text x="757.3333333333334" y="273" fill="#faf4e9" font-size="20">explain what the branch</text><text x="757.3333333333334" y="300" fill="#faf4e9" font-size="20">means.</text><text x="36" y="375" fill="#c3c4c1" font-size="17">Urban Canopy is a synthetic example. Its observation plans illustrate organization; they report no research</text><text x="36" y="399" fill="#c3c4c1" font-size="17">findings.</text></g></svg>