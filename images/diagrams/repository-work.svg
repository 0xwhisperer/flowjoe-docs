<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc"><title id="title">A repo node connects files and history</title><desc id="desc">Browse and edit: Open the repository’s files and edit the content you need.; Save the file: Write the current file changes to disk.; Commit in Git: Record saved changes in repository history after reviewing them.. Save and Commit are separate actions. A remote sync is another step; review the repository guide before discarding work.</desc><rect width="1100" height="420" rx="18" fill="#171819"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="42" fill="#ffad42" font-size="15" letter-spacing="2">CONCEPT DIAGRAM</text><text x="36" y="88" fill="#faf4e9" font-size="30" font-weight="700">A repo node connects files and history</text><rect x="36.0" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="56.0" y="159" fill="#ffad42" font-size="22" font-weight="700">Browse and edit</text><text x="56.0" y="219" fill="#faf4e9" font-size="20">Open the repository’s files</text><text x="56.0" y="246" fill="#faf4e9" font-size="20">and edit the content you</text><text x="56.0" y="273" fill="#faf4e9" font-size="20">need.</text><path d="M365.6666666666667 227h18m-6-6 6 6-6 6" stroke="#ffad42" stroke-width="2" fill="none"/><rect x="386.6666666666667" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="406.6666666666667" y="159" fill="#ffad42" font-size="22" font-weight="700">Save the file</text><text x="406.6666666666667" y="219" fill="#faf4e9" font-size="20">Write the current file</text><text x="406.6666666666667" y="246" fill="#faf4e9" font-size="20">changes to disk.</text><path d="M716.3333333333334 227h18m-6-6 6 6-6 6" stroke="#ffad42" stroke-width="2" fill="none"/><rect x="737.3333333333334" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="757.3333333333334" y="159" fill="#ffad42" font-size="22" font-weight="700">Commit in Git</text><text x="757.3333333333334" y="219" fill="#faf4e9" font-size="20">Record saved changes in</text><text x="757.3333333333334" y="246" fill="#faf4e9" font-size="20">repository history after</text><text x="757.3333333333334" y="273" fill="#faf4e9" font-size="20">reviewing them.</text><text x="36" y="375" fill="#c3c4c1" font-size="17">Save and Commit are separate actions. A remote sync is another step; review the repository guide before</text><text x="36" y="399" fill="#c3c4c1" font-size="17">discarding work.</text></g></svg>