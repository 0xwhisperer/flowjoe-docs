<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc"><title id="title">Bring web research into the Flow</title><desc id="desc">Read a page: Browse in the desktop app and choose the destination node.; Save the reference: Send the page to the gallery with its URL and available preview.; Add meaning: Write why you kept it. Explicitly ask Joe to read the current page when needed.. Reading an open browser page for Joe is a separate, request-specific action; guests cannot read your native browser.</desc><rect width="1100" height="420" rx="18" fill="#171819"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="42" fill="#ffad42" font-size="15" letter-spacing="2">CONCEPT DIAGRAM</text><text x="36" y="88" fill="#faf4e9" font-size="30" font-weight="700">Bring web research into the Flow</text><rect x="36.0" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="56.0" y="159" fill="#ffad42" font-size="22" font-weight="700">Read a page</text><text x="56.0" y="219" fill="#faf4e9" font-size="20">Browse in the desktop app</text><text x="56.0" y="246" fill="#faf4e9" font-size="20">and choose the destination</text><text x="56.0" y="273" fill="#faf4e9" font-size="20">node.</text><path d="M365.6666666666667 227h18m-6-6 6 6-6 6" stroke="#ffad42" stroke-width="2" fill="none"/><rect x="386.6666666666667" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="406.6666666666667" y="159" fill="#ffad42" font-size="22" font-weight="700">Save the reference</text><text x="406.6666666666667" y="219" fill="#faf4e9" font-size="20">Send the page to the</text><text x="406.6666666666667" y="246" fill="#faf4e9" font-size="20">gallery with its URL and</text><text x="406.6666666666667" y="273" fill="#faf4e9" font-size="20">available preview.</text><path d="M716.3333333333334 227h18m-6-6 6 6-6 6" stroke="#ffad42" stroke-width="2" fill="none"/><rect x="737.3333333333334" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="757.3333333333334" y="159" fill="#ffad42" font-size="22" font-weight="700">Add meaning</text><text x="757.3333333333334" y="219" fill="#faf4e9" font-size="20">Write why you kept it.</text><text x="757.3333333333334" y="246" fill="#faf4e9" font-size="20">Explicitly ask Joe to read</text><text x="757.3333333333334" y="273" fill="#faf4e9" font-size="20">the current page when</text><text x="757.3333333333334" y="300" fill="#faf4e9" font-size="20">needed.</text><text x="36" y="375" fill="#c3c4c1" font-size="17">Reading an open browser page for Joe is a separate, request-specific action; guests cannot read your native</text><text x="36" y="399" fill="#c3c4c1" font-size="17">browser.</text></g></svg>