<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc"><title id="title">From a request to a reviewed change</title><desc id="desc">1 · Describe the goal: Ask Joe to organize a branch or change its references.; 2 · Review the proposal: Check what will be created, moved, edited or removed.; 3 · Choose what happens: Approve the changes, reject them, or ask for a revision.. Joe chat asks before changing the Flow. Scheduled tasks and outside assistants have separate approval settings.</desc><rect width="1100" height="420" rx="18" fill="#171819"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="42" fill="#ffad42" font-size="15" letter-spacing="2">CONCEPT DIAGRAM</text><text x="36" y="88" fill="#faf4e9" font-size="30" font-weight="700">From a request to a reviewed change</text><rect x="36.0" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="56.0" y="159" fill="#ffad42" font-size="22" font-weight="700">1 · Describe the goal</text><text x="56.0" y="219" fill="#faf4e9" font-size="20">Ask Joe to organize a</text><text x="56.0" y="246" fill="#faf4e9" font-size="20">branch or change its</text><text x="56.0" y="273" fill="#faf4e9" font-size="20">references.</text><path d="M365.6666666666667 227h18m-6-6 6 6-6 6" stroke="#ffad42" stroke-width="2" fill="none"/><rect x="386.6666666666667" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="406.6666666666667" y="159" fill="#ffad42" font-size="22" font-weight="700">2 · Review the proposal</text><text x="406.6666666666667" y="219" fill="#faf4e9" font-size="20">Check what will be created,</text><text x="406.6666666666667" y="246" fill="#faf4e9" font-size="20">moved, edited or removed.</text><path d="M716.3333333333334 227h18m-6-6 6 6-6 6" stroke="#ffad42" stroke-width="2" fill="none"/><rect x="737.3333333333334" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="757.3333333333334" y="159" fill="#ffad42" font-size="22" font-weight="700">3 · Choose what happens</text><text x="757.3333333333334" y="219" fill="#faf4e9" font-size="20">Approve the changes, reject</text><text x="757.3333333333334" y="246" fill="#faf4e9" font-size="20">them, or ask for a</text><text x="757.3333333333334" y="273" fill="#faf4e9" font-size="20">revision.</text><text x="36" y="375" fill="#c3c4c1" font-size="17">Joe chat asks before changing the Flow. Scheduled tasks and outside assistants have separate approval</text><text x="36" y="399" fill="#c3c4c1" font-size="17">settings.</text></g></svg>