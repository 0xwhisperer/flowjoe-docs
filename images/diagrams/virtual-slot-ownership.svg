<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc"><title id="title">One reference, several places</title><desc id="desc">Master · Elena: The wedding invitation’s content, title, notes and tags live here.; Virtual · Tomás: Shows that same invitation in another node, with its own canvas placement.; Make Real Slot: Creates an independent copy. Later master edits no longer update that copy.. Removing only a virtual slot leaves its master in place. A virtual gallery is a search view, a different feature.</desc><rect width="1100" height="420" rx="18" fill="#171819"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="42" fill="#ffad42" font-size="15" letter-spacing="2">CONCEPT DIAGRAM</text><text x="36" y="88" fill="#faf4e9" font-size="30" font-weight="700">One reference, several places</text><rect x="36.0" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="56.0" y="159" fill="#ffad42" font-size="22" font-weight="700">Master · Elena</text><text x="56.0" y="219" fill="#faf4e9" font-size="20">The wedding invitation’s</text><text x="56.0" y="246" fill="#faf4e9" font-size="20">content, title, notes and</text><text x="56.0" y="273" fill="#faf4e9" font-size="20">tags live here.</text><path d="M365.6666666666667 227h18m-6-6 6 6-6 6" stroke="#ffad42" stroke-width="2" fill="none"/><rect x="386.6666666666667" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="406.6666666666667" y="159" fill="#ffad42" font-size="22" font-weight="700">Virtual · Tomás</text><text x="406.6666666666667" y="219" fill="#faf4e9" font-size="20">Shows that same invitation</text><text x="406.6666666666667" y="246" fill="#faf4e9" font-size="20">in another node, with its</text><text x="406.6666666666667" y="273" fill="#faf4e9" font-size="20">own canvas placement.</text><path d="M716.3333333333334 227h18m-6-6 6 6-6 6" stroke="#ffad42" stroke-width="2" fill="none"/><rect x="737.3333333333334" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="757.3333333333334" y="159" fill="#ffad42" font-size="22" font-weight="700">Make Real Slot</text><text x="757.3333333333334" y="219" fill="#faf4e9" font-size="20">Creates an independent</text><text x="757.3333333333334" y="246" fill="#faf4e9" font-size="20">copy. Later master edits no</text><text x="757.3333333333334" y="273" fill="#faf4e9" font-size="20">longer update that copy.</text><text x="36" y="375" fill="#c3c4c1" font-size="17">Removing only a virtual slot leaves its master in place. A virtual gallery is a search view, a different</text><text x="36" y="399" fill="#c3c4c1" font-size="17">feature.</text></g></svg>