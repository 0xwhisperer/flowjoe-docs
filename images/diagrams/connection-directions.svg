<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc"><title id="title">Three ways to work with a coding assistant</title><desc id="desc">Joe chat: Choose an installed CLI brain. Talk inside Joe; Flow edits still ask.; Agent Bridge: An outside assistant connects to FlowJoe and uses its permitted tools.; Forge terminal: Run a shell or assistant in the desktop app. Its commands use your account.. These are separate conversations and permission boundaries. Opening Forge is not required to use a CLI brain.</desc><rect width="1100" height="420" rx="18" fill="#171819"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="42" fill="#ffad42" font-size="15" letter-spacing="2">CONCEPT DIAGRAM</text><text x="36" y="88" fill="#faf4e9" font-size="30" font-weight="700">Three ways to work with a coding assistant</text><rect x="36.0" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="56.0" y="159" fill="#ffad42" font-size="22" font-weight="700">Joe chat</text><text x="56.0" y="219" fill="#faf4e9" font-size="20">Choose an installed CLI</text><text x="56.0" y="246" fill="#faf4e9" font-size="20">brain. Talk inside Joe;</text><text x="56.0" y="273" fill="#faf4e9" font-size="20">Flow edits still ask.</text><rect x="386.6666666666667" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="406.6666666666667" y="159" fill="#ffad42" font-size="22" font-weight="700">Agent Bridge</text><text x="406.6666666666667" y="219" fill="#faf4e9" font-size="20">An outside assistant</text><text x="406.6666666666667" y="246" fill="#faf4e9" font-size="20">connects to FlowJoe and</text><text x="406.6666666666667" y="273" fill="#faf4e9" font-size="20">uses its permitted tools.</text><rect x="737.3333333333334" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="757.3333333333334" y="159" fill="#ffad42" font-size="22" font-weight="700">Forge terminal</text><text x="757.3333333333334" y="219" fill="#faf4e9" font-size="20">Run a shell or assistant in</text><text x="757.3333333333334" y="246" fill="#faf4e9" font-size="20">the desktop app. Its</text><text x="757.3333333333334" y="273" fill="#faf4e9" font-size="20">commands use your account.</text><text x="36" y="375" fill="#c3c4c1" font-size="17">These are separate conversations and permission boundaries. Opening Forge is not required to use a CLI brain.</text></g></svg>