<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc"><title id="title">When a Workspace folder goes offline</title><desc id="desc">Folder unavailable: FlowJoe keeps working and saving locally with a warning.; Folder returns: FlowJoe checks the folder and your locally saved work.; Resume or review: Safe changes combine; conflicting changes wait for your review.. Choosing to stay Local stops automatic return. The Local version stays saved while you review a conflict.</desc><rect width="1100" height="420" rx="18" fill="#171819"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="42" fill="#ffad42" font-size="15" letter-spacing="2">CONCEPT DIAGRAM</text><text x="36" y="88" fill="#faf4e9" font-size="30" font-weight="700">When a Workspace folder goes offline</text><rect x="36.0" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="56.0" y="159" fill="#ffad42" font-size="22" font-weight="700">Folder unavailable</text><text x="56.0" y="219" fill="#faf4e9" font-size="20">FlowJoe keeps working and</text><text x="56.0" y="246" fill="#faf4e9" font-size="20">saving locally with a</text><text x="56.0" y="273" fill="#faf4e9" font-size="20">warning.</text><path d="M365.6666666666667 227h18m-6-6 6 6-6 6" stroke="#ffad42" stroke-width="2" fill="none"/><rect x="386.6666666666667" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="406.6666666666667" y="159" fill="#ffad42" font-size="22" font-weight="700">Folder returns</text><text x="406.6666666666667" y="219" fill="#faf4e9" font-size="20">FlowJoe checks the folder</text><text x="406.6666666666667" y="246" fill="#faf4e9" font-size="20">and your locally saved</text><text x="406.6666666666667" y="273" fill="#faf4e9" font-size="20">work.</text><path d="M716.3333333333334 227h18m-6-6 6 6-6 6" stroke="#ffad42" stroke-width="2" fill="none"/><rect x="737.3333333333334" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="757.3333333333334" y="159" fill="#ffad42" font-size="22" font-weight="700">Resume or review</text><text x="757.3333333333334" y="219" fill="#faf4e9" font-size="20">Safe changes combine;</text><text x="757.3333333333334" y="246" fill="#faf4e9" font-size="20">conflicting changes wait</text><text x="757.3333333333334" y="273" fill="#faf4e9" font-size="20">for your review.</text><text x="36" y="375" fill="#c3c4c1" font-size="17">Choosing to stay Local stops automatic return. The Local version stays saved while you review a conflict.</text></g></svg>