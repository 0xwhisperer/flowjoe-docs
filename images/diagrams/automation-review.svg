<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc"><title id="title">A recurring task has an approval policy</title><desc id="desc">Schedule: The owning Flow is open and Scheduled runs is enabled.; Run: Joe follows the task instructions within its current permitted scope.; Apply or review: Routine auto-apply changes may save; review-first or held results wait in the inbox.. Run Now authorizes an immediate run and apply; safety checks can still hold a result. Guest access is checked again.</desc><rect width="1100" height="420" rx="18" fill="#171819"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="42" fill="#ffad42" font-size="15" letter-spacing="2">CONCEPT DIAGRAM</text><text x="36" y="88" fill="#faf4e9" font-size="30" font-weight="700">A recurring task has an approval policy</text><rect x="36.0" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="56.0" y="159" fill="#ffad42" font-size="22" font-weight="700">Schedule</text><text x="56.0" y="219" fill="#faf4e9" font-size="20">The owning Flow is open and</text><text x="56.0" y="246" fill="#faf4e9" font-size="20">Scheduled runs is enabled.</text><path d="M365.6666666666667 227h18m-6-6 6 6-6 6" stroke="#ffad42" stroke-width="2" fill="none"/><rect x="386.6666666666667" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="406.6666666666667" y="159" fill="#ffad42" font-size="22" font-weight="700">Run</text><text x="406.6666666666667" y="219" fill="#faf4e9" font-size="20">Joe follows the task</text><text x="406.6666666666667" y="246" fill="#faf4e9" font-size="20">instructions within its</text><text x="406.6666666666667" y="273" fill="#faf4e9" font-size="20">current permitted scope.</text><path d="M716.3333333333334 227h18m-6-6 6 6-6 6" stroke="#ffad42" stroke-width="2" fill="none"/><rect x="737.3333333333334" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="757.3333333333334" y="159" fill="#ffad42" font-size="22" font-weight="700">Apply or review</text><text x="757.3333333333334" y="219" fill="#faf4e9" font-size="20">Routine auto-apply changes</text><text x="757.3333333333334" y="246" fill="#faf4e9" font-size="20">may save; review-first or</text><text x="757.3333333333334" y="273" fill="#faf4e9" font-size="20">held results wait in the</text><text x="757.3333333333334" y="300" fill="#faf4e9" font-size="20">inbox.</text><text x="36" y="375" fill="#c3c4c1" font-size="17">Run Now authorizes an immediate run and apply; safety checks can still hold a result. Guest access is checked</text><text x="36" y="399" fill="#c3c4c1" font-size="17">again.</text></g></svg>