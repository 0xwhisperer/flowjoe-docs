<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc"><title id="title">Share access, then choose how to present</title><desc id="desc">View invitation: Guests browse the shared area. Optional Joe questions do not grant edit access.; Edit invitation: Guests can change permitted shared content. Export and extra removal need separate permission.; Presenting: Guide guests through the Flow using follow controls. Private content remains excluded.. You choose what is shared. Native browser and terminal sessions and your credentials stay on your computer.</desc><rect width="1100" height="420" rx="18" fill="#171819"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="42" fill="#ffad42" font-size="15" letter-spacing="2">CONCEPT DIAGRAM</text><text x="36" y="88" fill="#faf4e9" font-size="30" font-weight="700">Share access, then choose how to present</text><rect x="36.0" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="56.0" y="159" fill="#ffad42" font-size="22" font-weight="700">View invitation</text><text x="56.0" y="219" fill="#faf4e9" font-size="20">Guests browse the shared</text><text x="56.0" y="246" fill="#faf4e9" font-size="20">area. Optional Joe</text><text x="56.0" y="273" fill="#faf4e9" font-size="20">questions do not grant edit</text><text x="56.0" y="300" fill="#faf4e9" font-size="20">access.</text><rect x="386.6666666666667" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="406.6666666666667" y="159" fill="#ffad42" font-size="22" font-weight="700">Edit invitation</text><text x="406.6666666666667" y="219" fill="#faf4e9" font-size="20">Guests can change permitted</text><text x="406.6666666666667" y="246" fill="#faf4e9" font-size="20">shared content. Export and</text><text x="406.6666666666667" y="273" fill="#faf4e9" font-size="20">extra removal need separate</text><text x="406.6666666666667" y="300" fill="#faf4e9" font-size="20">permission.</text><rect x="737.3333333333334" y="125" width="326.6666666666667" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="757.3333333333334" y="159" fill="#ffad42" font-size="22" font-weight="700">Presenting</text><text x="757.3333333333334" y="219" fill="#faf4e9" font-size="20">Guide guests through the</text><text x="757.3333333333334" y="246" fill="#faf4e9" font-size="20">Flow using follow controls.</text><text x="757.3333333333334" y="273" fill="#faf4e9" font-size="20">Private content remains</text><text x="757.3333333333334" y="300" fill="#faf4e9" font-size="20">excluded.</text><text x="36" y="375" fill="#c3c4c1" font-size="17">You choose what is shared. Native browser and terminal sessions and your credentials stay on your computer.</text></g></svg>