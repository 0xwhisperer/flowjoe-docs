<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="649" viewBox="0 0 1100 649" role="img" aria-labelledby="title desc"><title id="title">Four independent node controls</title><desc id="desc">Hidden: Hide the branch from ordinary tree browsing.; Frozen: Keep the branch visible while blocking edits.; Private: Require a password for owner access. Content stays out of guest sharing.; Hidden from Joe: Keep content available to you while sealing it from Joe’s Flow access.. These controls do different jobs. A visible node can still be frozen or hidden from Joe. Names may remain in the Flow map.</desc><rect width="1100" height="649" rx="18" fill="#171819"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="42" fill="#ffad42" font-size="15" letter-spacing="2">CONCEPT DIAGRAM</text><text x="36" y="88" fill="#faf4e9" font-size="30" font-weight="700">Four independent node controls</text><rect x="36.0" y="125" width="502.0" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="56.0" y="159" fill="#ffad42" font-size="22" font-weight="700">Hidden</text><text x="56.0" y="219" fill="#faf4e9" font-size="20">Hide the branch from ordinary tree browsing.</text><rect x="562.0" y="125" width="502.0" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="582.0" y="159" fill="#ffad42" font-size="22" font-weight="700">Frozen</text><text x="582.0" y="219" fill="#faf4e9" font-size="20">Keep the branch visible while blocking</text><text x="582.0" y="246" fill="#faf4e9" font-size="20">edits.</text><rect x="36.0" y="354" width="502.0" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="56.0" y="388" fill="#ffad42" font-size="22" font-weight="700">Private</text><text x="56.0" y="448" fill="#faf4e9" font-size="20">Require a password for owner access. Content</text><text x="56.0" y="475" fill="#faf4e9" font-size="20">stays out of guest sharing.</text><rect x="562.0" y="354" width="502.0" height="205" rx="12" fill="#242627" stroke="#59645d"/><text x="582.0" y="388" fill="#ffad42" font-size="22" font-weight="700">Hidden from Joe</text><text x="582.0" y="448" fill="#faf4e9" font-size="20">Keep content available to you while sealing</text><text x="582.0" y="475" fill="#faf4e9" font-size="20">it from Joe’s Flow access.</text><text x="36" y="604" fill="#c3c4c1" font-size="17">These controls do different jobs. A visible node can still be frozen or hidden from Joe. Names may remain in</text><text x="36" y="628" fill="#c3c4c1" font-size="17">the Flow map.</text></g></svg>