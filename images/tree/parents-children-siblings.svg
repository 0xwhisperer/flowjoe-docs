<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">Parents, children and siblings in a story bible</title><desc id="desc">The Glass Orchard is the root. Regions and places is its child. The lantern marsh is a child of Regions and places, and the parent of Reedhaven and The glass groves. Those two places are siblings because they have the same parent.</desc><rect width="1000" height="530" rx="18" fill="#171819"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="52" font-size="16" fill="#ffad42" letter-spacing="2">CONCEPT DIAGRAM · THE GLASS ORCHARD</text><g stroke="#8d958e" stroke-width="3" fill="none"><path d="M500 128V155 M500 215V242 M500 302V335 M255 335H745 M255 335V365 M745 335V365"/></g><g fill="#242627" stroke="#8d958e"><rect x="330" y="73" width="340" height="55" rx="10"/><rect x="330" y="155" width="340" height="60" rx="10"/><rect x="330" y="242" width="340" height="60" rx="10"/><rect x="85" y="365" width="340" height="60" rx="10"/><rect x="575" y="365" width="340" height="60" rx="10"/></g><g text-anchor="middle" fill="#faf4e9" font-size="24"><text x="500" y="109">The Glass Orchard</text><text x="500" y="194">Regions &amp; places</text><text x="500" y="281" fill="#ffad42">The lantern marsh</text><text x="255" y="404">Reedhaven</text><text x="745" y="404">The glass groves</text></g><g font-size="19" fill="#c3c4c1"><text x="695" y="108">Root: no parent</text><text x="695" y="278">Parent of both places</text><text x="500" y="468" text-anchor="middle">Siblings share a parent. Each node can have its own gallery and summary.</text><text x="500" y="502" text-anchor="middle" font-size="15">Each connecting line means “is the parent of”. Other branches are omitted for clarity.</text></g></g></svg>