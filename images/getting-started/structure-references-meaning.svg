<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">One Flow, three ways to understand your work</title>
  <desc id="description">Structure gives the café project a place for Brand direction. Selecting that node shows its references: a poster, colour palette and window concept. Notes explain why those references matter. Meaning can describe a node or an individual reference.</desc>
  <rect width="1200" height="560" rx="20" fill="#171819"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="44" y="60" font-size="16" letter-spacing="3" fill="#ffad42">ONE FLOW · DAYBREAK CAFÉ</text>
    <text x="44" y="108" font-size="32" font-weight="700" fill="#faf4e9">A place for the work. A reason to keep it.</text>
    <rect x="44" y="151" width="330" height="244" rx="12" fill="#242627"/>
    <text x="66" y="190" font-size="23" font-weight="700" fill="#ffad42">Structure</text>
    <text x="66" y="222" font-size="18" fill="#c3c4c1">Where does this belong?</text>
    <path d="M80 261v95m0-65h25m-25 35h25m-25 30h25" stroke="#7b817b" stroke-width="2" fill="none"/>
    <text x="66" y="263" font-size="19" fill="#faf4e9">Daybreak café</text>
    <text x="114" y="296" font-size="19" fill="#ffad42">Brand direction</text>
    <text x="114" y="331" font-size="19" fill="#c3c4c1">Menu &amp; service</text>
    <text x="114" y="366" font-size="19" fill="#c3c4c1">Opening weekend</text>
    <path d="M387 279h32m-9-8 9 8-9 8" stroke="#ffad42" stroke-width="2" fill="none"/>
    <rect x="432" y="151" width="330" height="244" rx="12" fill="#242627"/>
    <text x="454" y="190" font-size="23" font-weight="700" fill="#ffad42">References</text>
    <text x="454" y="222" font-size="18" fill="#c3c4c1">What are you working with?</text>
    <rect x="454" y="248" width="84" height="88" rx="5" fill="#f3e9d5"/>
    <circle cx="496" cy="282" r="20" fill="#df764c"/>
    <text x="496" y="318" font-family="Georgia, serif" text-anchor="middle" font-size="13" fill="#294c3e">daybreak</text>
    <rect x="553" y="248" width="84" height="88" rx="5" fill="#294c3e"/>
    <rect x="595" y="248" width="42" height="44" fill="#df764c"/>
    <rect x="595" y="292" width="42" height="44" fill="#f3e9d5"/>
    <rect x="652" y="248" width="84" height="88" rx="5" fill="#92a798"/>
    <text x="694" y="295" font-family="Georgia, serif" text-anchor="middle" font-size="15" fill="#fff7e9">daybreak</text>
    <text x="454" y="366" font-size="17" fill="#c3c4c1">Poster · palette · window concept</text>
    <rect x="806" y="151" width="350" height="244" rx="12" fill="#242627"/>
    <text x="828" y="190" font-size="23" font-weight="700" fill="#ffad42">Meaning</text>
    <text x="828" y="222" font-size="18" fill="#c3c4c1">Why does it matter?</text>
    <text x="828" y="268" font-size="19" fill="#faf4e9">“Warm paper. Natural oak.</text>
    <text x="828" y="298" font-size="19" fill="#faf4e9">One bright accent.”</text>
    <text x="828" y="345" font-size="17" fill="#c3c4c1">Notes, summaries and tags</text>
    <text x="828" y="373" font-size="17" fill="#c3c4c1">add context to the material.</text>
    <text x="44" y="448" font-size="19" fill="#faf4e9">Choose a node → see its gallery.</text>
    <text x="44" y="482" font-size="19" fill="#c3c4c1">Add meaning to the node, the individual reference, or both.</text>
    <text x="44" y="528" font-size="14" fill="#8e9691">CONCEPT DIAGRAM · The real app is shown in the screenshots alongside this explanation.</text>
  </g>
</svg>
